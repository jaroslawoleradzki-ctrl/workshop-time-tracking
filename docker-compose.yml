version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: worktime-db
    restart: always
    environment:
      POSTGRES_USER: time_user
      POSTGRES_PASSWORD: secure_db_password
      POSTGRES_DB: time_reporting
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worktime-api
    restart: always
    environment:
      DATABASE_URL: "postgresql://time_user:secure_db_password@postgres:5432/time_reporting?schema=public"
      JWT_SECRET: "a_very_secure_and_long_jwt_secret_key_for_workshop_time_reporting"
      PORT: 5000
      APP_VERSION: "0.2.1"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: worktime-web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
