version: '3.8'

services:
  docs-db:
    image: postgres:15-alpine
    container_name: workshop_docs_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_docs_pass
      POSTGRES_DB: time_reporting_docs
    ports:
      - "5433:5432"
    volumes:
      - docs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d time_reporting_docs"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  docs_postgres_data:
